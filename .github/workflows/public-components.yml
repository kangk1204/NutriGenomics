name: Public components

on:
  push:
    branches: [main]
    paths:
      - public-components/**
      - .github/workflows/public-components.yml
  pull_request:
    paths:
      - public-components/**
      - .github/workflows/public-components.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-components-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify tracked release inventory and hashes
        run: python public-components/verify_release.py --tracked
      - name: Test public GET and HEAD API
        working-directory: public-components/public-api
        run: npm test
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check --only-binary=:all: -r public-components/ci/requirements.txt
      - name: Test integration contracts and synthetic evidence dispatch
        working-directory: public-components/integration
        run: python -m pytest -q -p no:cacheprovider tests
      - name: Test food normalization contracts
        working-directory: public-components/food-quality
        run: python -m pytest -q -p no:cacheprovider test_normalize_food_db.py
      - name: Test food dictionary contracts
        working-directory: public-components/food-dictionary
        run: python -m pytest -q -p no:cacheprovider test_dictionary.py
      - name: Test bounded evidence parsers
        working-directory: public-components/evidence
        run: python -m pytest -q -p no:cacheprovider tests/test_literature.py tests/test_quote_grounding.py tests/test_structure_coverage.py tests/test_neural_ner.py tests/test_token_evaluation.py
      - name: Test export receipt hashes without model imports
        working-directory: public-components/methylation
        run: python -m pytest -q -p no:cacheprovider tests/test_export_manifest.py
      - name: Test isolated intervention validation contracts
        working-directory: public-components/intervention-atlas
        run: python -m pytest -q -p no:cacheprovider tests/test_validation_contract.py
