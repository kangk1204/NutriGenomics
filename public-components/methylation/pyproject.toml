[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nutriomics-htn-methylation"
version = "0.1.0"
description = "Leakage-controlled public hypertension methylation research pipeline"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.6", "joblib>=1.3", "threadpoolctl>=3.4", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]
annotation = ["requests>=2.32", "openpyxl>=3.1"]

[project.scripts]
nutriomics-methylation = "nutriomics_methylation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp"
