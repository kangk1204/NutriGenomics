[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutriomics-compound-target"
version = "0.1.0"
description = "Provenance-aware measured BindingDB Kd regression for NutriOmics research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.5", "rdkit>=2024.3", "requests>=2.31", "joblib>=1.3"]

[project.optional-dependencies]
neural = ["torch>=2.8"]
test = ["pytest>=8"]

[project.scripts]
nutriomics-dti = "nutriomics_dti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nutriomics_dti = ["vendor/DEARDTI_MIT_LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
