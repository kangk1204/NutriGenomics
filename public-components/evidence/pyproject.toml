[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutriomics-evidence-engine"
version = "0.1.0"
description = "Provenance preserving nutrition and molecular evidence engine"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "pyarrow>=17"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nutriomics-evidence = "nutriomics_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
