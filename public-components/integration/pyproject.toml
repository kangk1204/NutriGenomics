[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nutriomics-final-report"
version = "0.1.0"
description = "Provenance-preserving research job service and report integration"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7", "duckdb>=1.3", "python-multipart>=0.0.20", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
inference = ["torch==2.11.0", "transformers==4.57.3", "safetensors>=0.6"]
report = ["lxml>=6", "pandas>=2.2", "matplotlib>=3.9", "pypdf>=5", "olefile>=0.47", "scikit-learn>=1.6", "Pillow>=10", "pymupdf>=1.26"]

[project.scripts]
nutriomics-final = "nutriomics_final.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

pythonpath = ["src", "../evidence/src"]
